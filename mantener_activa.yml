# Mantiene despierta la app de Streamlit Community Cloud.
# Cada 8 horas abre la app en un navegador real; si está dormida, pulsa el botón de despertar.
# Configura en GitHub: Settings > Secrets and variables > Actions > Variables > APP_URL = https://TU-APP.streamlit.app
name: Mantener app activa
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abrir la app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          url = os.environ["APP_URL"].rstrip("/") + "/?ping=1"
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.goto(url, wait_until="domcontentloaded", timeout=120000)
              pg.wait_for_timeout(8000)
              boton = pg.get_by_role("button", name="Yes, get this app back up!")
              if boton.count():
                  boton.click()
                  pg.wait_for_timeout(60000)
              print("Título:", pg.title())
              b.close()
          PY
